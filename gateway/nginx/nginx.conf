user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. Request ID Validation & Normalization
    # Only allow safe alphanumeric characters, dashes, and underscores (8 to 64 chars).
    # If client provides an invalid/malformed ID, generate a cryptographically safe ID using $request_id.
    map $http_x_request_id $validated_request_id {
        default $request_id;
        "~*^[a-zA-Z0-9_\-]{8,64}$" $http_x_request_id;
    }

    # 2. Trace ID Validation & Normalization
    # Accepts safe client trace ID or links to the validated request ID.
    map $http_x_trace_id $validated_trace_id {
        default "trace-$validated_request_id";
        "~*^[a-zA-Z0-9_\-]{8,64}$" $http_x_trace_id;
    }

    # 3. WebSocket Connection Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 4. Structured JSON Logging
    # Secure: Logs normalized $uri instead of raw $request_uri to prevent leaking sensitive query tokens/passwords.
    log_format aegis_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"request_id":"$validated_request_id",'
        '"trace_id":"$validated_trace_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_address":"$upstream_addr",'
        '"remote_address":"$remote_addr",'
        '"host":"$host",'
        '"bytes_sent":$bytes_sent,'
        '"request_length":$request_length,'
        '"response_length":$body_bytes_sent,'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log  /var/log/nginx/access.log  aegis_json;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
