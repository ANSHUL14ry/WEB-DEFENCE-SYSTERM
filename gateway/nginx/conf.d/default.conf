upstream aegis_api {
    server api:8000;
}

upstream aegis_origin {
    server origin:8088;
}

server {
    listen 80;
    server_name localhost;

    # AEGIS Gateway Direct Health Check
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"aegis-gateway","gateway_id":"ingress-01","version":"0.1.0"}\n';
    }

    # API Proxy Routing
    location /api/ {
        # Forward or generate X-Request-ID
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Add response header so clients can track their Request ID
        add_header X-Request-ID $request_id always;
        add_header X-Protected-By "AEGIS-Omega-Gateway" always;

        proxy_pass http://aegis_api;
    }

    # Protected Application Traffic -> Origin
    location / {
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Request-ID $request_id always;
        add_header X-Protected-By "AEGIS-Omega-Gateway" always;

        proxy_pass http://aegis_origin;
    }
}
