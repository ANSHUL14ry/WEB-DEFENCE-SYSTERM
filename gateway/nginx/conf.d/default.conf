upstream aegis_api {
    server api:8000;
    keepalive 32;
}

upstream aegis_waf {
    server waf:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    default_type application/json;

    # Baseline Request Body Limits (Defensive Ingress Baseline)
    client_max_body_size 10M;

    # Explicit Upstream Timeouts (Development Defaults)
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    # Standard Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: http: https:; img-src 'self' data: https:; font-src 'self' https: data:;" always;
    add_header X-Request-ID $validated_request_id always;
    add_header X-Trace-ID $validated_trace_id always;
    add_header X-Protected-By "AEGIS-Omega-Gateway" always;

    # Controlled Error Responses (Prevent Leaking Internal Network Architecture)
    proxy_intercept_errors on;
    error_page 502 503 504 = @upstream_error;
    error_page 413 = @error_413;
    error_page 403 = @waf_blocked;

    location @upstream_error {
        return 502 '{"error":"Bad Gateway","status":502,"message":"Upstream service temporarily unreachable or timed out","request_id":"$validated_request_id"}\n';
    }

    location @error_413 {
        return 413 '{"error":"Payload Too Large","status":413,"message":"Request body exceeds maximum permitted limit (10MB)","request_id":"$validated_request_id"}\n';
    }

    location @waf_blocked {
        return 403 '{"error":"request_blocked","status":403,"message":"Request blocked by AEGIS Web Application Firewall","request_id":"$validated_request_id","trace_id":"$validated_trace_id"}\n';
    }

    # Restrict unsupported / arbitrary HTTP methods
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$) {
        return 405 '{"error":"Method Not Allowed","status":405,"message":"HTTP method not supported by gateway","request_id":"$validated_request_id"}\n';
    }

    # AEGIS Gateway Direct Health Check (Independent of Upstream Services)
    location = /healthz {
        access_log off;
        return 200 '{"status":"healthy","service":"aegis-gateway","gateway_id":"ingress-01","version":"0.3.0"}\n';
    }

    # API Proxy Routing
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $validated_request_id;
        proxy_set_header X-Trace-ID $validated_trace_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://aegis_api;
    }

    # Protected Application Traffic -> Coraza WAF (Caddy + OWASP CRS) -> Origin
    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $validated_request_id;
        proxy_set_header X-Trace-ID $validated_trace_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://aegis_waf;
    }
}
