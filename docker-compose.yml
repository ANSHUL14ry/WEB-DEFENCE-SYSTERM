services:
  # 1. PostgreSQL Telemetry & State Store
  db:
    image: postgres:16-alpine
    container_name: aegis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_secure_hackathon_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-aegis_security_db}
    ports:
      - "5433:5432"
    volumes:
      - ./database/migrations/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/migrations/02_waf_events.sql:/docker-entrypoint-initdb.d/02_waf_events.sql:ro
      - ./database/migrations/03_security_events.sql:/docker-entrypoint-initdb.d/03_security_events.sql:ro
      - ./database/migrations/04_risk_assessments.sql:/docker-entrypoint-initdb.d/04_risk_assessments.sql:ro
      - ./database/migrations/05_agent_shield.sql:/docker-entrypoint-initdb.d/05_agent_shield.sql:ro
      - ./database/migrations/06_policy_decisions.sql:/docker-entrypoint-initdb.d/06_policy_decisions.sql:ro
      - ./database/migrations/07_deception.sql:/docker-entrypoint-initdb.d/07_deception.sql:ro
      - ./database/seed/seed.sql:/docker-entrypoint-initdb.d/08_seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_admin -d aegis_security_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aegis-net

  # 2. Control Plane & Backend API
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: aegis-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aegis_admin}:${POSTGRES_PASSWORD:-aegis_secure_hackathon_pass_2026}@db:5432/${POSTGRES_DB:-aegis_security_db}
      AEGIS_ENV: ${AEGIS_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WAF_MODE: ${WAF_MODE:-BLOCK}
      CORAZA_AUDIT_LOG_PATH: /var/log/coraza/audit.log
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080}
      DECOY_SERVICE_URL: ${DECOY_SERVICE_URL:-http://decoy:8090}
    ports:
      - "8001:8000"
    volumes:
      - waf_logs:/var/log/coraza:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aegis-net
      - deception-net

  # 3. Temporary Protected Origin Service (Protected Application)
  origin:
    build:
      context: ./services/origin
      dockerfile: Dockerfile
    container_name: aegis-origin
    restart: unless-stopped
    networks:
      - aegis-net

  # 4. Real Coraza WAF Service (Coraza v3 + OWASP CRS v4.30.0)
  waf:
    build:
      context: ./services/waf
      dockerfile: Dockerfile
    container_name: aegis-waf
    restart: unless-stopped
    environment:
      BACKEND: "origin:8088"
      PORT: "8080"
      CORAZA_RULE_ENGINE: ${WAF_RULE_ENGINE:-On} # On for BLOCK mode, DetectionOnly for DETECTION
      CORAZA_REQ_BODY_ACCESS: "On"
      CORAZA_RESP_BODY_ACCESS: "On"
      CORAZA_AUDIT_ENGINE: "RelevantOnly"
      CORAZA_AUDIT_LOG: "/var/log/coraza/audit.log"
      CORAZA_AUDIT_LOG_FORMAT: "JSON"
      ACCESSLOG: "/var/log/coraza/access.log"
    volumes:
      - waf_logs:/var/log/coraza
    depends_on:
      origin:
        condition: service_healthy
    networks:
      - aegis-net

  # 5. AEGIS Ingress Gateway (Reverse Proxy & Header Tagging)
  gateway:
    build:
      context: ./gateway/nginx
      dockerfile: Dockerfile
    container_name: aegis-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
      waf:
        condition: service_healthy
    networks:
      - aegis-net

  # 6. SOC Defense Dashboard
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: aegis-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - aegis-net

  # 7. Isolated Adaptive Decoy Honeypot (Phase 8)
  decoy:
    build:
      context: ./services/deception
      dockerfile: Dockerfile
    container_name: aegis-decoy
    restart: unless-stopped
    environment:
      PORT: "8090"
      AEGIS_ENV: ${AEGIS_ENV:-isolated-decoy}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 3s
      retries: 3
    networks:
      - deception-net

volumes:
  pgdata:
    driver: local
  waf_logs:
    driver: local

networks:
  aegis-net:
    name: aegis-net
    driver: bridge
  deception-net:
    name: deception-net
    driver: bridge
